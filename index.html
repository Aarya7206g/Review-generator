<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MADAC Healthcare — Reviews under 60 sec</title>

  <!-- PWA & Mobile Web Tags -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Write an authentic Google Review for MADAC Healthcare & Diagnostics in under 60 seconds." />
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22MADAC%20Review%20Assistant%22,%22short_name%22:%22MADAC%20Reviews%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22#0f172a%22,%22theme_color%22:%22#0891b2%22}" />

  <!-- Tailwind CSS & Font Awesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            madac: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-teal-500 selection:text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function MadacReviewApp() {
      // Automatically pre-configured with official MADAC details & Place ID
      const [config, setConfig] = useState({
        businessName: "MADAC Healthcare & Diagnostics",
        website: "https://madac.co.in/",
        logoUrl: "https://madac.co.in/wp-content/uploads/2021/04/madac-logo.png",
        googleReviewUrl: "https://search.google.com/local/writereview?placeid=ChIJRfXzd6453DsRRQN4R5Kuok0",
        clientApiKey: "", 
        aiProvider: "anthropic",
        showPoweredBy: true,
        showTag: true
      });

      const [step, setStep] = useState(1);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [copiedIndex, setCopiedIndex] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [apiError, setApiError] = useState("");

      const [patientData, setPatientData] = useState({
        serviceType: "General Consultation",
        rating: 5,
        highlights: ["Friendly Staff", "Clean Facility", "Prompt Service"],
        customNote: ""
      });

      const [drafts, setDrafts] = useState([]);

      useEffect(() => {
        const saved = localStorage.getItem("madac_client_config");
        if (saved) {
          try {
            setConfig(prev => ({ ...prev, ...JSON.parse(saved) }));
          } catch(e) {}
        }
      }, []);

      const saveSettings = (e) => {
        e.preventDefault();
        localStorage.setItem("madac_client_config", JSON.stringify(config));
        setShowSettingsModal(false);
        alert("MADAC Settings updated successfully!");
      };

      const toggleHighlight = (item) => {
        setPatientData(prev => ({
          ...prev,
          highlights: prev.highlights.includes(item)
            ? prev.highlights.filter(h => h !== item)
            : [...prev.highlights, item]
        }));
      };

      const handleGenerateReviews = async () => {
        setIsGenerating(true);
        setApiError("");

        setTimeout(() => {
          const hText = patientData.highlights.length > 0 
            ? patientData.highlights.join(" and ").toLowerCase() 
            : "quality healthcare service";

          setDrafts([
            {
              type: "Short & Sweet",
              text: `Had a great experience at ${config.businessName} for ${patientData.serviceType.toLowerCase()}. Loved the ${hText}!`
            },
            {
              type: "Balanced",
              text: `Consulted ${config.businessName} for ${patientData.serviceType.toLowerCase()}. The staff was prompt and polite. I really appreciated their ${hText}. Highly recommended!`
            },
            {
              type: "Detailed",
              text: `A very reliable healthcare center! I visited ${config.businessName} for ${patientData.serviceType.toLowerCase()}${patientData.customNote ? ` - ${patientData.customNote}` : ''}. The care and attention provided was top-notch. Their ${hText} stands out immediately.`
            }
          ]);
          setIsGenerating(false);
          setStep(2);
        }, 800);
      };

      const copyToClipboard = (text, idx) => {
        navigator.clipboard.writeText(text);
        setCopiedIndex(idx);
        setTimeout(() => setCopiedIndex(null), 2500);
      };

      const handlePostToGoogle = (text, idx) => {
        navigator.clipboard.writeText(text);
        setCopiedIndex(idx);
        window.open(config.googleReviewUrl, '_blank');
        setStep(3);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between items-center pb-8 px-4">
          
          {/* HEADER & AUTOMATIC LOGO */}
          <header className="w-full max-w-lg bg-slate-800/90 backdrop-blur-md border-b border-teal-500/20 py-3 px-4 sticky top-0 z-30 flex items-center justify-between rounded-b-xl shadow-lg mt-0">
            <div className="flex items-center gap-3">
              <div className="bg-white p-1 rounded-xl shadow-md border border-teal-500/30 w-10 h-10 flex items-center justify-center overflow-hidden">
                <img src={config.logoUrl} alt="MADAC Logo" className="w-full h-full object-contain" />
              </div>
              <div>
                <h1 className="font-bold text-sm sm:text-base text-white leading-tight">{config.businessName}</h1>
                
                {config.showTag && (
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span className="inline-flex items-center gap-1 bg-gradient-to-r from-amber-500/20 to-teal-500/20 border border-amber-500/40 text-amber-300 text-[10px] font-semibold px-2 py-0.5 rounded-full shadow-sm">
                      <i className="fa-solid fa-bolt text-amber-400"></i> Reviews under 60 sec
                    </span>
                  </div>
                )}
              </div>
            </div>

            <button 
              onClick={() => setShowSettingsModal(true)}
              className="p-2 text-slate-400 hover:text-teal-400 bg-slate-700/50 hover:bg-slate-700 rounded-xl transition-colors relative"
              title="Settings"
            >
              <i className="fa-solid fa-gear text-base"></i>
            </button>
          </header>

          {/* MAIN CONTAINER */}
          <main className="w-full max-w-lg pt-4 flex-1">
            
            <div className="mb-5 bg-slate-800/60 p-3 rounded-xl border border-slate-700 flex items-center justify-between text-xs">
              <div className={`flex items-center gap-1.5 ${step >= 1 ? 'text-teal-400 font-semibold' : 'text-slate-500'}`}>
                <span className="w-5 h-5 rounded-full bg-teal-500/20 border border-teal-500/40 flex items-center justify-center text-[10px]">1</span>
                Experience
              </div>
              <i className="fa-solid fa-chevron-right text-slate-600 text-[10px]"></i>
              <div className={`flex items-center gap-1.5 ${step >= 2 ? 'text-teal-400 font-semibold' : 'text-slate-500'}`}>
                <span className="w-5 h-5 rounded-full bg-teal-500/20 border border-teal-500/40 flex items-center justify-center text-[10px]">2</span>
                AI Drafts
              </div>
              <i className="fa-solid fa-chevron-right text-slate-600 text-[10px]"></i>
              <div className={`flex items-center gap-1.5 ${step === 3 ? 'text-teal-400 font-semibold' : 'text-slate-500'}`}>
                <span className="w-5 h-5 rounded-full bg-teal-500/20 border border-teal-500/40 flex items-center justify-center text-[10px]">3</span>
                Post Google
              </div>
            </div>

            {step === 1 && (
              <div className="space-y-4 bg-slate-800/40 border border-slate-700/80 p-5 rounded-2xl shadow-xl backdrop-blur-sm">
                
                <div className="flex items-center justify-between border-b border-slate-700/60 pb-3">
                  <div>
                    <h2 className="text-sm font-bold text-white">How was your visit?</h2>
                    <p className="text-[11px] text-slate-400">Takes under 60 seconds to generate an authentic review.</p>
                  </div>
                  <span className="text-[10px] bg-amber-500/10 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30 font-medium">
                    <i className="fa-solid fa-bolt text-amber-400 mr-1"></i> ~45 sec
                  </span>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-teal-300 uppercase tracking-wider mb-2">1. Service Received</label>
                  <div className="grid grid-cols-2 gap-2">
                    {[
                      "General Consultation",
                      "Health Checkup Package",
                      "Diagnostics & Lab Tests",
                      "Pharmacy / Medicine",
                      "Specialist Consultation"
                    ].map((service) => (
                      <button
                        key={service}
                        type="button"
                        onClick={() => setPatientData({ ...patientData, serviceType: service })}
                        className={`p-2.5 text-xs text-left rounded-xl border transition-all ${
                          patientData.serviceType === service
                            ? "bg-teal-500/20 border-teal-400 text-teal-200 font-medium"
                            : "bg-slate-800/80 border-slate-700 text-slate-300 hover:border-slate-600"
                        }`}
                      >
                        {service}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-teal-300 uppercase tracking-wider mb-2">2. Rating</label>
                  <div className="flex justify-between bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                    {[1, 2, 3, 4, 5].map((star) => (
                      <button
                        key={star}
                        type="button"
                        onClick={() => setPatientData({ ...patientData, rating: star })}
                        className="p-1 transition-transform active:scale-125"
                      >
                        <i className={`fa-star text-2xl ${star <= patientData.rating ? "fa-solid text-amber-400" : "fa-regular text-slate-600"}`}></i>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-teal-300 uppercase tracking-wider mb-2">3. What went well?</label>
                  <div className="flex flex-wrap gap-2">
                    {[
                      "Prompt Service",
                      "Friendly Staff",
                      "Clean Facility",
                      "Accurate Diagnostics",
                      "Doctor Expertise",
                      "Affordable Packages"
                    ].map((item) => {
                      const active = patientData.highlights.includes(item);
                      return (
                        <button
                          key={item}
                          type="button"
                          onClick={() => toggleHighlight(item)}
                          className={`px-3 py-1.5 rounded-lg text-xs border transition-all ${
                            active
                              ? "bg-teal-500/20 border-teal-400 text-teal-200"
                              : "bg-slate-800/60 border-slate-700 text-slate-400"
                          }`}
                        >
                          {active ? "✓ " : "+ "}{item}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">4. Additional Comments (Optional)</label>
                  <textarea
                    value={patientData.customNote}
                    onChange={(e) => setPatientData({ ...patientData, customNote: e.target.value })}
                    placeholder="Mention doctor's name or specific experience..."
                    rows={2}
                    className="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-teal-500"
                  />
                </div>

                <button
                  onClick={handleGenerateReviews}
                  disabled={isGenerating}
                  className="w-full py-3.5 bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-400 hover:to-cyan-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-teal-500/20 flex items-center justify-center gap-2 transition-all active:scale-[0.98]"
                >
                  {isGenerating ? (
                    <>
                      <i className="fa-solid fa-circle-notch fa-spin"></i> Generating 3 Drafts...
                    </>
                  ) : (
                    <>
                      <i className="fa-solid fa-wand-magic-sparkles"></i> Generate 3 AI Review Drafts
                    </>
                  )}
                </button>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-semibold text-white flex items-center gap-2">
                    <i className="fa-solid fa-wand-magic-sparkles text-teal-400"></i> Select Your Review Draft
                  </h2>
                  <button 
                    onClick={() => setStep(1)} 
                    className="text-xs text-teal-400 hover:underline"
                  >
                    Edit Answers
                  </button>
                </div>

                {drafts.map((draft, idx) => (
                  <div key={idx} className="bg-slate-800/60 border border-slate-700 p-4 rounded-2xl space-y-3">
                    <div className="flex items-center justify-between border-b border-slate-700/60 pb-2">
                      <span className="text-xs font-semibold text-teal-300 uppercase tracking-wider">{draft.type}</span>
                      <span className="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">Option {idx + 1}</span>
                    </div>

                    <textarea
                      value={draft.text}
                      onChange={(e) => {
                        const newDrafts = [...drafts];
                        newDrafts[idx].text = e.target.value;
                        setDrafts(newDrafts);
                      }}
                      rows={3}
                      className="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-teal-500 resize-none"
                    />

                    <div className="flex gap-2">
                      <button
                        onClick={() => copyToClipboard(draft.text, idx)}
                        className="flex-1 py-2 bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl flex items-center justify-center gap-1.5 transition-colors"
                      >
                        <i className={`fa-solid ${copiedIndex === idx ? 'fa-check text-teal-400' : 'fa-copy text-slate-400'}`}></i>
                        {copiedIndex === idx ? "Copied!" : "Copy Text"}
                      </button>

                      <button
                        onClick={() => handlePostToGoogle(draft.text, idx)}
                        className="flex-1 py-2 bg-teal-500 hover:bg-teal-400 text-slate-950 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-md shadow-teal-500/20 transition-colors"
                      >
                        <i className="fa-solid fa-arrow-up-right-from-square"></i> Copy & Post Google
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {step === 3 && (
              <div className="bg-slate-800/80 border border-teal-500/30 p-6 rounded-2xl text-center space-y-4 backdrop-blur-md">
                <div className="w-12 h-12 bg-teal-500/20 text-teal-400 rounded-full flex items-center justify-center mx-auto border border-teal-500/40">
                  <i className="fa-solid fa-circle-check text-2xl"></i>
                </div>

                <div>
                  <h2 className="text-lg font-bold text-white">Review Copied to Clipboard!</h2>
                  <p className="text-xs text-slate-300 mt-1">
                    Your official Google Review window has opened. Paste your copied review and click submit!
                  </p>
                </div>

                <div className="bg-slate-900/90 p-3.5 rounded-xl border border-slate-700/80 text-left space-y-2 text-xs">
                  <div className="font-semibold text-teal-400 flex items-center gap-1.5">
                    <i className="fa-solid fa-list-check"></i> Final Steps on Google:
                  </div>
                  <ol className="list-decimal list-inside text-slate-300 space-y-1 pl-1">
                    <li>Select star rating on Google.</li>
                    <li>Long press / right-click in review box and click <b>Paste</b>.</li>
                    <li>Click <b>Post</b>.</li>
                  </ol>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setStep(1)}
                    className="flex-1 py-2.5 bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl"
                  >
                    Write Another Review
                  </button>
                  <a
                    href={config.googleReviewUrl}
                    target="_blank"
                    rel="noreferrer"
                    className="flex-1 py-2.5 bg-teal-500 text-slate-950 text-xs font-bold rounded-xl flex items-center justify-center gap-1"
                  >
                    Reopen Google <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                  </a>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="w-full max-w-lg mt-6 text-center text-xs text-slate-500 space-y-1">
            <div className="flex items-center justify-center gap-2">
              <span className="text-[10px] text-amber-300/80 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20">
                <i className="fa-solid fa-bolt text-amber-400 mr-1"></i> Reviews under 60 sec
              </span>
              {config.showPoweredBy && (
                <span>
                  Powered by{" "}
                  <a 
                    href="https://arnavtechnosys.com" 
                    target="_blank" 
                    rel="noreferrer" 
                    className="text-teal-400 hover:underline font-medium"
                  >
                    Arnav Technosys
                  </a>
                </span>
              )}
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MadacReviewApp />);
  </script>
</body>
</html>
